name: Release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version (for example 0.1.0)
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/WebsiteBuilder.Editor/package-lock.json
      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $value = $env:INPUT_VERSION
          if (-not $value) { $value = $env:REF_NAME.TrimStart('v') }
          if ($value -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid semantic version.' }
          "value=$value" >> $env:GITHUB_OUTPUT
      - name: Install pinned Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $compiler = ./scripts/install-inno.ps1 -Destination "$env:RUNNER_TEMP\InnoSetup"
          "compiler=$compiler" >> $env:GITHUB_OUTPUT
      - name: Build portable package and Windows installer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
          INNO_COMPILER: ${{ steps.inno.outputs.compiler }}
        run: ./scripts/package-release.ps1 -Version $env:PACKAGE_VERSION -InnoCompiler $env:INNO_COMPILER
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Likha-${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/release/Likha-${{ steps.version.outputs.value }}-win-x64.zip
            artifacts/release/Likha-${{ steps.version.outputs.value }}-win-x64-setup.exe
            artifacts/release/Likha-${{ steps.version.outputs.value }}-win-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 30
